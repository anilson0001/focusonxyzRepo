<!-- AIAgency portal init fallback (safety net — primary init is in connector.js) -->
<script>
(function () {
  function _initPortal() {
    if (window.AIAgency && window.AIAgency.portal &&
        typeof window.AIAgency.portal.init === 'function' &&
        !window.AIAgency.portal._initialised) {
      AIAgency.portal.init('#aiagency_portal', { theme: 'dark', tenant: 'ten_0001' });
    }
  }
  if (window.AIAgency && window.AIAgency.connector &&
      window.AIAgency.connector.status === 'READY') {
    _initPortal();
  } else {
    document.addEventListener('aiagency.ready', _initPortal, { once: true });
  }
}());
</script>
